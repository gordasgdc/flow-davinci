name: Windows baseline and shared workspace checks
on:
  workflow_dispatch:
  push:
    branches: [release/0.0.2-prototype]
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build-only Qt dependencies
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --outputdir "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and exercise the Windows backend
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./infrastructure/windows/build-release.ps1 -QtPath "$env:RUNNER_TEMP/Qt/5.15.2/msvc2019_64" *>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-evidence-${{ github.sha }}
          path: |
            windows-build.log
            build/windows/**/release-manifest.json
            build/windows/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14
# Build evidence only: full managed-workspace integration and Resolve runtime
# parity remain open. This workflow never packages or publishes a user release.
# Qt installer syntax: https://aqtinstall.readthedocs.io/en/v3.3.0/cli.html
